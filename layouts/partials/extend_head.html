<!-- Homepage visual override + normal PaperMod theme persistence -->
<script>
  (function () {
    const isHome =
      window.location.pathname === "/uOpenBlog/" ||
      window.location.pathname === "/uOpenBlog/index.html";

    const savedTheme = localStorage.getItem("pref-theme");
    const root = document.documentElement;

    function applyHomeDark() {
      root.classList.add("home-dark");
      root.classList.add("dark");
      root.setAttribute("data-theme", "dark");
    }

    function applySavedTheme() {
      root.classList.remove("home-dark");

      if (savedTheme === "dark") {
        root.classList.add("dark");
        root.setAttribute("data-theme", "dark");
      } else if (savedTheme === "light") {
        root.classList.remove("dark");
        root.setAttribute("data-theme", "light");
      }
    }

    if (isHome) {
      applyHomeDark();
    } else {
      applySavedTheme();
    }

    document.addEventListener("DOMContentLoaded", function () {
      if (document.body) {
        if (isHome) {
          document.body.classList.add("home-dark");
          document.body.classList.add("dark");
        } else {
          document.body.classList.remove("home-dark");

          if (savedTheme === "dark") {
            document.body.classList.add("dark");
          } else if (savedTheme === "light") {
            document.body.classList.remove("dark");
          }
        }
      }
    });
  })();
</script>
